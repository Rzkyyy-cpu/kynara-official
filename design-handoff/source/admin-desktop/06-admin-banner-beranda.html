<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<title>Admin Banner Beranda</title>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#FAF1F1;color:#2B2B2B;font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
a{color:#3F5A7D;text-decoration:none}
h1,h2,h3,h4,p{margin:0}
.serif{font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-weight:500;letter-spacing:-0.01em}
.muted{color:#5E5A62}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;border:1px solid transparent;font:600 14px/1 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn-primary{background:#4A6588;color:#FFFFFF}
.btn-outline{background:#FFFFFF;color:#2B2B2B;border-color:#DCCBCD}
.card{background:#FFFFFF;border:1px solid #EFE1E2;border-radius:14px}
.h{font-size:16px;font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.label{font-size:13px;font-weight:600}
.hint{font-size:12px;color:#5E5A62}
.input{height:44px;padding:0 12px;border:1px solid #DCCBCD;border-radius:10px;background:#FFFFFF;font:400 14px 'Plus Jakarta Sans',sans-serif;color:#2B2B2B;width:100%}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:700}
.ib{width:36px;height:36px;border:0;border-radius:8px;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:#2B2B2B;cursor:pointer}
.up{border:1.5px dashed #C9B7BA;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;color:#3F5A7D;background:#FCF6F6;cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 1120px; display: grid; grid-template-columns: 248px minmax(0, 1fr); background: #FAF1F1">
<div style="position: sticky; top: 0; height: 1024px; align-self: start"><dc-import name="AdminSidebar" active="banner" hint-size="248px,1024px"></dc-import></div>
<main style="padding: 32px 40px; display: flex; flex-direction: column; gap: 20px">
<header style="display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; flex-direction: column; gap: 4px"><h1 class="serif" style="font-size: 32px; line-height: 40px">Banner beranda</h1><span class="muted" style="font-size: 14px">Banner aktif paling atas tampil di hero beranda. Maks. 3 banner bergantian.</span></div>
<button type="button" class="btn btn-primary"><svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Tambah Banner</button>
</header>
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 20px; align-items: start">
<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{banners}}" as="b" hint-placeholder-count="3">
<article class="card" style="padding: 16px; display: grid; grid-template-columns: 28px 200px 64px minmax(0, 1fr) auto; gap: 16px; align-items: center; border: 1.5px solid {{b.bd}}">
<button type="button" class="ib" aria-label="Geser urutan" style="cursor: grab; color: #8C8285; width: 28px"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.5"></circle><circle cx="15" cy="6" r="1.5"></circle><circle cx="9" cy="12" r="1.5"></circle><circle cx="15" cy="12" r="1.5"></circle><circle cx="9" cy="18" r="1.5"></circle><circle cx="15" cy="18" r="1.5"></circle></svg></button>
<span style="height: 90px; border-radius: 8px; background: {{b.tone}}; position: relative"><span style="position: absolute; left: 6px; bottom: 6px; font-size: 10px; font-weight: 700; background: rgba(255,253,249,0.9); padding: 2px 6px; border-radius: 4px">Desktop</span></span>
<span style="height: 80px; border-radius: 8px; background: {{b.tone}}; position: relative"><span style="position: absolute; left: 4px; bottom: 4px; font-size: 10px; font-weight: 700; background: rgba(255,253,249,0.9); padding: 2px 4px; border-radius: 4px">HP</span></span>
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0"><div style="display: flex; gap: 8px; align-items: center"><strong style="font-size: 15px">{{b.title}}</strong><span class="pill" style="background: {{b.sBg}}; color: {{b.sFg}}">{{b.status}}</span></div><span class="muted" style="font-size: 13px">Tombol "{{b.cta}}" → {{b.link}}</span><span class="muted" style="font-size: 12px">{{b.when}}</span></div>
<button type="button" class="btn btn-outline" sc-camel-on-click="{{b.pick}}" style="height: 36px">Edit</button>
</article>
</sc-for>
</div>
<section class="card" style="padding: 24px; display: flex; flex-direction: column; gap: 16px">
<h2 class="h">Edit banner</h2>
<div style="position: relative; height: 180px; border-radius: 12px; background: #4A6588; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; padding: 18px">
<span style="position: absolute; right: 10px; top: 10px; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: rgba(255,253,249,0.9)">Pratinjau</span>
<span class="serif" style="font-size: 22px; line-height: 28px; color: #FFFFFF; max-width: 260px; text-shadow: 0 1px 8px rgba(0,0,0,0.25)">{{title}}</span>
<span style="align-self: flex-start; height: 30px; padding: 0 14px; border-radius: 999px; background: #4A6588; color: #FFFFFF; font-size: 12px; font-weight: 600; display: flex; align-items: center">{{cta}}</span>
</div>
<div class="field"><label class="label" for="bt">Judul</label><input id="bt" class="input" value="{{title}}" sc-camel-on-change="{{setTitle}}" maxlength="48"><span class="hint">Maks. 48 karakter, 1–2 baris di HP.</span></div>
<div class="field"><label class="label" for="bs">Subjudul <span class="muted" style="font-weight: 400">(opsional)</span></label><input id="bs" class="input" value="Kerudung dan busana muslimah dari bahan pilihan."></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div class="field"><label class="label" for="bc">Teks tombol</label><input id="bc" class="input" value="{{cta}}" sc-camel-on-change="{{setCta}}" maxlength="24"></div>
<div class="field"><label class="label" for="bl">Tautan tombol</label><sc-raw-select id="bl" class="input"><option>Semua koleksi</option><option>Kategori: Pashmina</option><option>Produk tertentu</option></sc-raw-select></div>
</div>
<div style="display: grid; grid-template-columns: 2fr 1fr; gap: 12px">
<div class="field"><span class="label">Gambar desktop</span><button type="button" class="up" style="height: 96px"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V5M7 10l5-5 5 5"></path><path d="M5 19h14"></path></svg>1440 × 640 px</button></div>
<div class="field"><span class="label">Gambar HP</span><button type="button" class="up" style="height: 96px">4:5</button></div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div class="field"><label class="label" for="bm">Mulai tayang</label><input id="bm" class="input" type="date" value="2026-09-15"></div>
<div class="field"><label class="label" for="be">Selesai <span class="muted" style="font-weight: 400">(opsional)</span></label><input id="be" class="input" type="date"></div>
</div>
<div style="display: flex; gap: 10px; margin-top: 4px"><button type="button" class="btn btn-primary" style="flex-grow: 1">Simpan &amp; Tayangkan</button><button type="button" class="btn btn-outline">Simpan draf</button></div>
</section>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1120}}">
class Component extends DCLogic {
  renderVals() {
    const sel = this.state.sel ?? 0;
    const list = [
      { title: 'Tenang dipakai, anggun dilihat.', cta: 'Belanja Sekarang', link: 'Semua koleksi', when: 'Tayang sejak 15 Sep 2026', status: 'Aktif', sBg: '#E4F0F4', sFg: '#2B3E5B', tone: '#9DAE9B' },
      { title: 'Pashmina Airflow untuk hari panas', cta: 'Lihat Pashmina', link: 'Kategori: Pashmina', when: 'Mulai 5 Okt 2026', status: 'Terjadwal', sBg: '#ECE8F5', sFg: '#4A3F72', tone: '#D9C7B0' },
      { title: 'Koleksi Outer Linen', cta: 'Lihat Outer', link: 'Kategori: Outer', when: 'Berakhir 31 Agu 2026', status: 'Nonaktif', sBg: '#F0E8EA', sFg: '#4A4650', tone: '#D9A48C' }
    ];
    const title = this.state.title ?? list[sel].title;
    const cta = this.state.cta ?? list[sel].cta;
    return {
      title: title,
      cta: cta,
      setTitle: (e) => this.setState({ title: e.target.value }),
      setCta: (e) => this.setState({ cta: e.target.value }),
      banners: list.map((b, i) => Object.assign({}, b, { bd: i === sel ? '#708BAA' : '#EFE1E2', pick: () => this.setState({ sel: i, title: undefined, cta: undefined }) }))
    };
  }
}
</script>


</body></html>
