<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<title>Menu Drawer — Mobile</title>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#FFF6F5;color:#2B2B2B;font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
a{color:#3F5A7D;text-decoration:none}
h1,h2,h3,h4,p{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:999px;border:1px solid transparent;font:600 15px/1 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn-primary{background:#4A6588;color:#FFFFFF}
.btn-outline{background:transparent;color:#2B2B2B;border-color:#2B2B2B}
.item{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 20px;font-size:17px;font-weight:600;color:#2B2B2B;text-decoration:none;background:transparent;border:0;width:100%;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer}
.sub{display:flex;align-items:center;min-height:40px;padding:0 20px 0 36px;font-size:15px;color:#4A4650;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFF6F5">
<dc-import name="NavMobile" hint-size="390px,64px"></dc-import>
<div style="margin: 16px 20px; height: 440px; border-radius: 16px; background: #9FC7D5"></div>
<a href="MBeranda.dc.html" aria-label="Tutup menu" style="position: absolute; inset: 0; background: rgba(43,43,43,0.5)"></a>

<aside role="dialog" aria-modal="true" aria-label="Menu" style="position: absolute; top: 0; left: 0; bottom: 0; width: 330px; background: #FFFFFF; display: flex; flex-direction: column; box-shadow: 12px 0 40px rgba(43,43,43,0.18)">
<div style="height: 64px; padding: 0 8px 0 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #EFE1E2">
<span style="font-family: 'Playfair Display', Georgia, serif; font-size: 26px; font-weight: 500">kynara</span>
<a href="MBeranda.dc.html" aria-label="Tutup menu" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #2B2B2B"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
</div>
<label style="margin: 16px 20px; height: 48px; border: 1px solid #DCCBCD; border-radius: 999px; display: flex; align-items: center; gap: 10px; padding: 0 16px; color: #5E5A62"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><input aria-label="Cari produk" placeholder="Cari pashmina, bergo…" style="border: 0; outline: 0; background: transparent; font: 400 15px 'Plus Jakarta Sans', sans-serif; width: 100%; color: #2B2B2B"></label>
<nav aria-label="Menu utama" style="display: flex; flex-direction: column">
<a class="item" href="MBeranda.dc.html">Beranda</a>
<button type="button" class="item" aria-expanded="{{openStr}}" sc-camel-on-click="{{toggle}}" style="color: #3F5A7D">Koleksi <svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{rot}})"><path d="m6 9 6 6 6-6"></path></svg></button>
<sc-if value="{{open}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; padding-bottom: 8px">
<a class="sub" href="MKoleksi.dc.html">Hijab Segi Empat</a><a class="sub" href="MKoleksi.dc.html">Pashmina</a><a class="sub" href="MKoleksi.dc.html">Instan / Bergo</a><a class="sub" href="MKoleksi.dc.html">Outer</a><a class="sub" href="MKoleksi.dc.html">Bawahan</a><a class="sub" href="MKoleksi.dc.html">Dress</a><a class="sub" href="MKoleksi.dc.html">Aksesoris</a>
</div>
</sc-if>
<a class="item" href="MBeranda.dc.html">Panduan</a>
<a class="item" href="MBeranda.dc.html">Tentang Kami</a>
</nav>
<div style="margin-top: auto; padding: 16px 20px 20px; border-top: 1px solid #EFE1E2; display: flex; flex-direction: column; gap: 12px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px"><a class="btn btn-outline" href="MMasuk.dc.html">Masuk</a><a class="btn btn-primary" href="MDaftar.dc.html">Daftar</a></div>
<a href="https://wa.me/" style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14px; font-weight: 600; color: #3F5A7D"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1.3-3.9A8 8 0 1 1 8.2 19z"></path></svg>Butuh bantuan? Chat WhatsApp</a>
</div>
</aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    const open = this.state.open ?? true;
    return { open: open, openStr: open ? 'true' : 'false', rot: open ? '180deg' : '0deg', toggle: () => this.setState({ open: !open }) };
  }
}
</script>


</body></html>
