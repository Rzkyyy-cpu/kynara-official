<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<title>Filter dan Urutkan — Mobile</title>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#FFF6F5;color:#2B2B2B;font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
a{color:#3F5A7D;text-decoration:none}
h1,h2,h3,h4,p{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 20px;border-radius:999px;border:1px solid transparent;font:600 15px/1 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn-primary{background:#4A6588;color:#FFFFFF}
.btn-outline{background:transparent;color:#2B2B2B;border-color:#2B2B2B}
.chip{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:999px;border:1px solid #DCCBCD;background:#FFFFFF;color:#2B2B2B;font:500 14px 'Plus Jakarta Sans',sans-serif;cursor:pointer;white-space:nowrap}
.grp{display:flex;flex-direction:column;gap:12px;border:0;margin:0;padding:0}
.grp legend{font-size:14px;font-weight:700;margin-bottom:12px;padding:0}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.input{width:100%;height:44px;padding:0 12px;border:1px solid #DCCBCD;border-radius:12px;background:#FFFFFF;color:#2B2B2B;font:400 14px 'Plus Jakarta Sans',sans-serif}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFF6F5">
<dc-import name="NavMobile" hint-size="390px,64px"></dc-import>
<div style="padding: 16px 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px"><div style="aspect-ratio: 4 / 5; border-radius: 10px; background: #B9C4B2"></div><div style="aspect-ratio: 4 / 5; border-radius: 10px; background: #D9C7B0"></div></div>
<a href="MKoleksi.dc.html" aria-label="Tutup filter" style="position: absolute; inset: 0; background: rgba(43,43,43,0.5)"></a>

<section role="dialog" aria-modal="true" aria-label="Filter dan urutkan" style="position: absolute; left: 0; right: 0; bottom: 0; top: 56px; background: #FFFFFF; border-radius: 20px 20px 0 0; display: flex; flex-direction: column">
<div style="display: flex; justify-content: center; padding-top: 8px"><span style="width: 40px; height: 4px; border-radius: 2px; background: #DCCBCD"></span></div>
<div style="height: 56px; padding: 0 8px 0 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #EFE1E2">
<h2 style="font-size: 18px; font-weight: 700">Filter &amp; urutkan</h2>
<a href="MKoleksi.dc.html" aria-label="Tutup" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #2B2B2B"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
</div>
<div style="flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 24px">
<fieldset class="grp"><legend>Urutkan</legend><div class="wrap">
<sc-for list="{{sorts}}" as="o" hint-placeholder-count="4"><button type="button" class="chip" aria-pressed="{{o.pressed}}" sc-camel-on-click="{{o.pick}}" style="background: {{o.bg}}; color: {{o.fg}}; border-color: {{o.bd}}">{{o.label}}</button></sc-for>
</div></fieldset>
<fieldset class="grp"><legend>Bahan</legend><div class="wrap">
<sc-for list="{{mats}}" as="o" hint-placeholder-count="7"><button type="button" class="chip" aria-pressed="{{o.pressed}}" sc-camel-on-click="{{o.pick}}" style="background: {{o.bg}}; color: {{o.fg}}; border-color: {{o.bd}}">{{o.label}}</button></sc-for>
</div></fieldset>
<fieldset class="grp"><legend>Harga</legend>
<div style="display: grid; grid-template-columns: 1fr 16px 1fr; gap: 8px; align-items: center"><input class="input" aria-label="Harga minimum" inputmode="numeric" placeholder="Min Rp0"><span style="text-align: center">–</span><input class="input" aria-label="Harga maksimum" inputmode="numeric" placeholder="Maks Rp500.000"></div>
<div class="wrap">
<sc-for list="{{prices}}" as="o" hint-placeholder-count="3"><button type="button" class="chip" aria-pressed="{{o.pressed}}" sc-camel-on-click="{{o.pick}}" style="background: {{o.bg}}; color: {{o.fg}}; border-color: {{o.bd}}">{{o.label}}</button></sc-for>
</div></fieldset>
<fieldset class="grp"><legend>Kategori</legend><div class="wrap">
<sc-for list="{{cats}}" as="o" hint-placeholder-count="7"><button type="button" class="chip" aria-pressed="{{o.pressed}}" sc-camel-on-click="{{o.pick}}" style="background: {{o.bg}}; color: {{o.fg}}; border-color: {{o.bd}}">{{o.label}}</button></sc-for>
</div></fieldset>
</div>
<div style="padding: 12px 20px 20px; border-top: 1px solid #EFE1E2; display: grid; grid-template-columns: 1fr 2fr; gap: 10px; background: #FFFFFF">
<button type="button" class="btn btn-outline" sc-camel-on-click="{{reset}}">Reset</button>
<a class="btn btn-primary" href="MKoleksi.dc.html">Tampilkan {{count}} produk</a>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    const sort = this.state.sort ?? 'Terbaru';
    const mats = this.state.mats ?? ['Airflow', 'Ceruty'];
    const price = this.state.price ?? '';
    const cat = this.state.cat ?? 'Pashmina';
    const look = (on) => ({ pressed: on ? 'true' : 'false', bg: on ? '#2B2B2B' : '#FFFFFF', fg: on ? '#FFF6F5' : '#2B2B2B', bd: on ? '#2B2B2B' : '#DCCBCD' });
    const one = (list, cur, key) => list.map((l) => Object.assign({ label: l, pick: () => { const s = {}; s[key] = cur === l ? '' : l; this.setState(s); } }, look(cur === l)));
    return {
      sorts: ['Terbaru', 'Terlaris', 'Harga terendah', 'Harga tertinggi'].map((l) => Object.assign({ label: l, pick: () => this.setState({ sort: l }) }, look(sort === l))),
      mats: ['Voal', 'Airflow', 'Satin', 'Ceruty', 'Jersey', 'Katun', 'Linen'].map((l) => {
        const on = mats.indexOf(l) >= 0;
        return Object.assign({ label: l, pick: () => this.setState({ mats: on ? mats.filter((m) => m !== l) : mats.concat([l]) }) }, look(on));
      }),
      prices: one(['< Rp90rb', 'Rp90–150rb', '> Rp150rb'], price, 'price'),
      cats: one(['Segi Empat', 'Pashmina', 'Instan / Bergo', 'Outer', 'Bawahan', 'Dress', 'Aksesoris'], cat, 'cat'),
      count: mats.length === 0 ? 8 : Math.max(0, 3 * mats.length - (price ? 2 : 0)),
      reset: () => this.setState({ sort: 'Terbaru', mats: [], price: '', cat: '' })
    };
  }
}
</script>


</body></html>
