<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<title>Koleksi — Mobile</title>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#FFF6F5;color:#2B2B2B;font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
a{color:#3F5A7D;text-decoration:none}
h1,h2,h3,h4,p{margin:0}
.serif{font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-weight:500;letter-spacing:-0.01em}
.muted{color:#5E5A62}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:999px;border:1px solid transparent;font:600 15px/1 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn-outline{background:transparent;color:#2B2B2B;border-color:#2B2B2B}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;border:1px solid #DCCBCD;background:#FFFFFF;color:#2B2B2B;font:500 13px 'Plus Jakarta Sans',sans-serif;cursor:pointer;white-space:nowrap;text-decoration:none;flex-shrink:0}
.chip.on{background:#2B2B2B;border-color:#2B2B2B;color:#FFF6F5}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:0 20px;scrollbar-width:none}
.tool{flex:1;height:44px;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid #DCCBCD;border-radius:999px;background:#FFFFFF;color:#2B2B2B;font:600 14px 'Plus Jakarta Sans',sans-serif;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 3060px; display: flex; flex-direction: column; background: #FFF6F5">

<section style="padding: 16px 20px 0; display: flex; flex-direction: column; gap: 6px">
<nav aria-label="Breadcrumb" style="display: flex; gap: 6px; font-size: 12px"><a href="MBeranda.dc.html">Beranda</a><span class="muted">/</span><span class="muted">Koleksi</span></nav>
<h1 class="serif" style="font-size: 32px; line-height: 40px">Pashmina</h1>
<span class="muted" style="font-size: 14px">8 produk</span>

<a class="tool" href="MFilter.dc.html"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"></path></svg>Terbaru</a>
</div>

<div style="padding: 0 20px 4px; display: flex; gap: 8px; flex-wrap: wrap">
<button type="button" class="chip" style="height: 32px; background: #E4F0F4; border-color: #E4F0F4; color: #33496A">Airflow <svg width="14" height="14" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
<button type="button" class="chip" style="height: 32px; background: #E4F0F4; border-color: #E4F0F4; color: #33496A">Ceruty <svg width="14" height="14" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</div>

<section style="padding: 16px 20px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 12px">
<sc-for list="{{items}}" as="p" hint-placeholder-count="8">
<dc-import name="ProductCard" item="{{p}}" href="MProduk.dc.html" compact="{{true}}" hint-size="100%,341px"></dc-import>
</sc-for>
</section>

<div style="padding: 32px 20px 48px; display: flex; flex-direction: column; align-items: center; gap: 12px">
<span class="muted" style="font-size: 13px">Menampilkan 8 produk</span>
<button type="button" class="btn btn-outline" sc-camel-on-click="{{more}}" style="width: 100%">{{moreLabel}}</button>
</div>

<div style="margin-top: auto"><dc-import name="FooterMobile" hint-size="390px,1060px"></dc-import></div>
<div style="position: sticky; bottom: 0; z-index: 30"><dc-import name="BottomNav" active="koleksi" hint-size="390px,64px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:3060}}">

      items: [
        { name: 'Pashmina Airflow Sekar', price: 'Rp79.000', material: 'Airflow', tone: '#B9C4B2', colors: ['#B9C4B2', '#D9C7B0', '#8E735E', '#B8A9BF'], tag: 'Baru' },

        { name: 'Pashmina Airflow Sekar Jumbo', price: 'Rp89.000', material: 'Airflow', tone: '#D9A48C', colors: ['#D9A48C', '#D9C7B0'], tag: '' },
        { name: 'Pashmina Ceruty Wening', price: 'Rp85.000', material: 'Ceruty', tone: '#B8A9BF', colors: ['#B8A9BF', '#EDE3D3', '#9AA9B5'], tag: '' },
        { name: 'Pashmina Airflow Dasar', price: 'Rp69.000', material: 'Airflow', tone: '#EDE3D3', colors: ['#EDE3D3', '#2B2B2B', '#8E735E', '#708BAA'], tag: 'Stok terbatas' }
      ]
    };
  }
}
</script>


</body></html>
