<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["beranda","koleksi","keranjang","akun"],"default":"beranda"},"$preview":{"width":390,"height":64}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'beranda';
    const c = {};
    const w = {};
    ['beranda', 'koleksi', 'keranjang', 'akun'].forEach((k) => {
      c[k] = k === active ? '#3F5A7D' : '#5E5A62';
      w[k] = k === active ? '700' : '500';
    });
    return { c: c, w: w };
  }
}
