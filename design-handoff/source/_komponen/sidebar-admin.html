<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Sidebar Admin</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<aside style="width: 248px; height: 1024px; box-sizing: border-box; padding: 24px 16px; display: flex; flex-direction: column; gap: 28px; background: #2B3C57; color: #E8EEF5; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
<div style="display: flex; align-items: baseline; gap: 8px; padding: 0 8px"><span style="font-family: 'Playfair Display', Georgia, serif; font-size: 28px; font-weight: 500; color: #FFF6F5">kynara</span><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #C3D3E2">Admin</span></div>
<nav aria-label="Menu admin" style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="5">
<a href="{{it.href}}" aria-current="{{it.cur}}" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; font-size: 14px; font-weight: {{it.fw}}; color: {{it.fg}}; background: {{it.bg}}; text-decoration: none">
<span style="width: 8px; height: 8px; border-radius: 2px; background: {{it.dot}}"></span>
<span style="flex-grow: 1">{{it.label}}</span>
<sc-if value="{{it.badge}}" hint-placeholder-val="{{false}}"><span style="min-width: 22px; height: 20px; padding: 0 6px; border-radius: 999px; background: #E8A3AC; color: #2B2B2B; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{it.badge}}</span></sc-if>
</a>
</sc-for>
</nav>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid rgba(233,237,230,0.25); font-size: 14px; font-weight: 600; color: #E8EEF5; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"></path></svg>Lihat toko</a>
<div style="display: flex; align-items: center; gap: 10px; padding: 8px"><span style="width: 36px; height: 36px; border-radius: 999px; background: #708BAA; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">AD</span><div style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 13px; font-weight: 600">Admin kynara</span><span style="font-size: 12px; color: #C3D3E2">Pemilik</span></div><a href="DMasuk.dc.html" aria-label="Keluar" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: #E8EEF5"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 16l-4-4 4-4M6 12h10"></path></svg></a></div>
</div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["ringkasan","pesanan","produk","kategori","banner"],"default":"ringkasan"},"$preview":{"width":248,"height":1024}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'ringkasan';
    const list = [
      ['ringkasan', 'Ringkasan', 'ARingkasan.dc.html', ''],
      ['pesanan', 'Pesanan', 'APesanan.dc.html', '5'],
      ['produk', 'Produk', 'AProduk.dc.html', ''],
      ['kategori', 'Kategori', 'AKategori.dc.html', ''],
      ['banner', 'Banner beranda', 'ABanner.dc.html', '']
    ];
    return {
      items: list.map((l) => {
        const on = l[0] === active;
        return { label: l[1], href: l[2], badge: l[3], cur: on ? 'page' : 'false', fw: on ? '700' : '500', fg: on ? '#2B2B2B' : '#E8EEF5', bg: on ? '#FFF6F5' : 'transparent', dot: on ? '#3F5A7D' : 'rgba(233,237,230,0.35)' };
      })
    };
  }
}
</script>
</body>
</html>
