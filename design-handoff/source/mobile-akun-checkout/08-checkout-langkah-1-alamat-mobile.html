<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<title>Checkout Langkah 1 Alamat — Mobile</title>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#FFF6F5;color:#2B2B2B;font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
a{color:#3F5A7D;text-decoration:none}
h1,h2,h3,h4,p{margin:0}
.muted{color:#5E5A62}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 20px;border-radius:999px;border:1px solid transparent;font:600 15px/1 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn-primary{background:#4A6588;color:#FFFFFF}
.card{background:#FFFFFF;border:1px solid #EFE1E2;border-radius:16px}
.input{width:100%;padding:12px 14px;border:1px solid #DCCBCD;border-radius:12px;background:#FFFFFF;color:#2B2B2B;font:400 15px 'Plus Jakarta Sans',sans-serif}
.dot{width:28px;height:28px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.opt{display:grid;grid-template-columns:24px 1fr;gap:12px;padding:16px;border-radius:16px;background:#FFFFFF;cursor:pointer}
.opt input{width:20px;height:20px;margin:2px 0 0;accent-color:#3F5A7D}
</style>
</helmet>
<div style="width: 390px; height: 980px; display: flex; flex-direction: column; background: #FFF6F5">
<header style="height: 56px; padding: 0 12px 0 8px; display: flex; align-items: center; justify-content: space-between; background: #FFFFFF; border-bottom: 1px solid #EFE1E2">
<a href="MKeranjang.dc.html" aria-label="Kembali ke keranjang" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #2B2B2B"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
<span style="font-size: 16px; font-weight: 700">Checkout</span>
<span style="display: flex; gap: 4px; align-items: center; font-size: 12px; font-weight: 600; color: #33496A"><svg width="14" height="14" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Aman</span>
</header>
<ol aria-label="Langkah checkout" style="margin: 0; padding: 16px 20px; list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #FFFFFF; border-bottom: 1px solid #EFE1E2">
<li aria-current="step" style="display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 700"><span class="dot" style="background: #2B2B2B; color: #FFF6F5">1</span>Alamat</li>
<li style="display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: #5E5A62"><span class="dot" style="border: 1.5px solid #C9B7BA; color: #5E5A62">2</span>Pengiriman</li>
<li style="display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: #5E5A62"><span class="dot" style="border: 1.5px solid #C9B7BA; color: #5E5A62">3</span>Pembayaran</li>
</ol>
<main style="padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 16px">
<button type="button" class="card" sc-camel-on-click="{{toggleSum}}" aria-expanded="{{sumStr}}" style="padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; font: 600 14px 'Plus Jakarta Sans', sans-serif; color: #2B2B2B; cursor: pointer; text-align: left"><span>Ringkasan pesanan · 4 produk</span><span style="display: flex; gap: 6px; align-items: center">Rp226.000<svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span></button>
<sc-if value="{{sum}}" hint-placeholder-val="{{false}}">
<div class="card" style="padding: 8px 16px; font-size: 13px">
<div style="display: flex; justify-content: space-between; min-height: 36px; align-items: center"><span>Pashmina Airflow Sekar × 1</span><span>Rp79.000</span></div>
<div style="display: flex; justify-content: space-between; min-height: 36px; align-items: center"><span>Segi Empat Voal Aruna × 1</span><span>Rp89.000</span></div>
<div style="display: flex; justify-content: space-between; min-height: 36px; align-items: center"><span>Ciput Rajut Dasar × 2</span><span>Rp58.000</span></div>
</div>
</sc-if>
<h1 style="font-size: 18px; font-weight: 700; margin-top: 4px">Kirim ke mana?</h1>
<fieldset style="border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px">
<legend class="muted" style="font-size: 13px; margin-bottom: 10px; padding: 0">Pilih alamat pengiriman</legend>
<sc-for list="{{addrs}}" as="a" hint-placeholder-count="2">
<label class="opt" style="border: 1.5px solid {{a.bd}}"><input type="radio" name="alamat" checked="{{a.on}}" sc-camel-on-change="{{a.pick}}"><span style="display: flex; flex-direction: column; gap: 4px"><span style="display: flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 700">{{a.label}}<sc-if value="{{a.main}}" hint-placeholder-val="{{false}}"><span style="height: 20px; padding: 0 8px; border-radius: 999px; background: #E4F0F4; color: #2B3E5B; font-size: 11px; display: flex; align-items: center">Utama</span></sc-if></span><span style="font-size: 14px; font-weight: 600">{{a.who}}</span><span class="muted" style="font-size: 13px; line-height: 20px">{{a.addr}}</span></span></label>
</sc-for>
</fieldset>
<a href="MAlamat.dc.html" style="height: 52px; border: 1.5px dashed #C9B7BA; border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600; color: #2B2B2B"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Tambah alamat baru</a>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Catatan untuk penjual <span class="muted" style="font-weight: 400; font-size: 12px">Opsional, misalnya permintaan kemasan hadiah.</span><textarea class="input" rows="2" style="resize: none"></textarea></label>
</main>
<div style="position: sticky; bottom: 0; margin-top: auto; padding: 12px 20px 20px; background: #FFFFFF; border-top: 1px solid #EFE1E2; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column"><span class="muted" style="font-size: 12px">Subtotal</span><strong style="font-size: 18px">Rp226.000</strong></div>
<a class="btn btn-primary" href="MCheckout2.dc.html" style="flex-grow: 1; max-width: 220px">Lanjut ke Pengiriman</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:980}}">
class Component extends DCLogic {
  renderVals() {
    const sel = this.state.sel ?? 0;
    const sum = this.state.sum ?? false;
    const list = [
      { label: 'Rumah', main: true, who: 'Nadia Azzahra · 0812-3456-7890', addr: 'Jl. Contoh No. 12, RT 03/RW 05, Kec. Contoh, Kota Contoh, Jawa Barat 46xxx' },
      { label: 'Kos', main: false, who: 'Nadia Azzahra · 0812-3456-7890', addr: 'Jl. Contoh Kampus No. 4, Kec. Contoh, Kota Contoh, Jawa Barat 46xxx' }
    ];
    return {
      sum: sum,
      sumStr: sum ? 'true' : 'false',
      toggleSum: () => this.setState({ sum: !sum }),
      addrs: list.map((a, i) => Object.assign({}, a, { on: i === sel, bd: i === sel ? '#3F5A7D' : '#EFE1E2', pick: () => this.setState({ sel: i }) }))
    };
  }
}
</script>


</body></html>
