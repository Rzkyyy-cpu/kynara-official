<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<title>Akun dan Riwayat Pesanan — Mobile</title>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#FFF6F5;color:#2B2B2B;font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
a{color:#3F5A7D;text-decoration:none}
h1,h2,h3,h4,p{margin:0}
.serif{font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-weight:500;letter-spacing:-0.01em}
.muted{color:#5E5A62}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;border:1px solid transparent;font:600 14px/1 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn-primary{background:#4A6588;color:#FFFFFF}
.btn-outline{background:transparent;color:#2B2B2B;border-color:#DCCBCD}
.card{background:#FFFFFF;border:1px solid #EFE1E2;border-radius:16px}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;border:1px solid #DCCBCD;font:500 13px 'Plus Jakarta Sans',sans-serif;cursor:pointer;white-space:nowrap;flex-shrink:0}
.scroller{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:0 20px;scrollbar-width:none}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:84px;border-radius:14px;background:#FFFFFF;border:1px solid #EFE1E2;font-size:12px;font-weight:600;color:#2B2B2B;text-decoration:none}
.st{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:11px;font-weight:700}
</style>
</helmet>
<div style="width: 390px; height: 1480px; display: flex; flex-direction: column; background: #FFF6F5">
<div style="position: sticky; top: 0; z-index: 30"><dc-import name="NavMobile" hint-size="390px,64px"></dc-import></div>
<main style="padding: 20px; display: flex; flex-direction: column; gap: 20px">
<section style="display: flex; align-items: center; gap: 14px">
<span style="width: 56px; height: 56px; border-radius: 999px; background: #3F5A7D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px">NA</span>
<div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><h1 style="font-size: 18px; font-weight: 700">Nadia Azzahra</h1><span class="muted" style="font-size: 13px">nadia@email.com</span></div>
<a href="MProfil.dc.html" style="font-size: 13px; font-weight: 600; min-height: 44px; display: flex; align-items: center">Ubah</a>
</section>
<nav aria-label="Menu akun" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<a class="tile" href="MAkun.dc.html" aria-current="page" style="background: #E4F0F4; border-color: #E4F0F4; color: #2B3E5B"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8 12 4l8 4v8l-8 4-8-4z"></path><path d="M4 8l8 4 8-4M12 12v8"></path></svg>Pesanan</a>
<a class="tile" href="MWishlist.dc.html"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>Wishlist</a>
<a class="tile" href="MAlamat.dc.html"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"></path><circle cx="12" cy="10" r="2.2"></circle></svg>Alamat</a>
<a class="tile" href="MProfil.dc.html"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Profil</a>
</nav>
<section style="display: flex; flex-direction: column; gap: 14px">
<h2 class="serif" style="font-size: 24px; line-height: 32px">Riwayat pesanan</h2>
<div class="scroller">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5"><button type="button" class="chip" aria-pressed="{{t.pressed}}" sc-camel-on-click="{{t.pick}}" style="background: {{t.bg}}; color: {{t.fg}}; border-color: {{t.bd}}">{{t.label}}</button></sc-for>
</div>
<sc-for list="{{orders}}" as="o" hint-placeholder-count="4">
<article class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px"><div style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 13px">{{o.id}}</strong><span class="muted" style="font-size: 12px">{{o.date}}</span></div><span class="st" style="background: {{o.bg}}; color: {{o.fg}}">{{o.status}}</span></div>
<div style="height: 1px; background: #EFE1E2"></div>
<div style="display: flex; gap: 12px; align-items: center"><span style="width: 56px; aspect-ratio: 4 / 5; border-radius: 8px; background: {{o.tone}}; flex-shrink: 0"></span><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">{{o.name}}</span><span class="muted" style="font-size: 12px">{{o.more}}</span><span style="font-size: 12px; color: #7A5410; font-weight: 600">{{o.note}}</span></div></div>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px"><div style="display: flex; flex-direction: column"><span class="muted" style="font-size: 12px">Total</span><strong style="font-size: 15px">{{o.total}}</strong></div><div style="display: flex; gap: 8px"><a class="btn btn-outline" href="MStatus.dc.html">Detail</a><sc-if value="{{o.pay}}" hint-placeholder-val="{{false}}"><a class="btn btn-primary" href="MCheckout3.dc.html">Bayar</a></sc-if><sc-if value="{{o.done}}" hint-placeholder-val="{{false}}"><a class="btn btn-outline" href="MProduk.dc.html">Beri ulasan</a></sc-if></div></div>
</article>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
<div class="card" style="padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center"><span style="width: 64px; height: 64px; border-radius: 999px; background: #E4F0F4; color: #3F5A7D; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8 12 4l8 4v8l-8 4-8-4z"></path><path d="M4 8l8 4 8-4M12 12v8"></path></svg></span><strong style="font-size: 16px">Belum ada pesanan di sini</strong><span class="muted" style="font-size: 14px; line-height: 21px">Pesanan dengan status ini akan muncul di halaman ini.</span></div>
</sc-if>
</section>
<button type="button" class="btn btn-outline" style="width: 100%; height: 48px; color: #8C2F48">Keluar</button>
</main>
<div style="position: sticky; bottom: 0; z-index: 30; margin-top: auto"><dc-import name="BottomNav" active="akun" hint-size="390px,64px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:1480}}">
class Component extends DCLogic {
  renderVals() {
    const S = {
      bayar: { label: 'Menunggu Pembayaran', bg: '#F6EBD3', fg: '#6B4A0E' },
      proses: { label: 'Diproses', bg: '#ECE8F5', fg: '#4A3F72' },
      kirim: { label: 'Dikirim', bg: '#E4F0F4', fg: '#2B3E5B' },
      selesai: { label: 'Selesai', bg: '#F0E8EA', fg: '#4A4650' }
    };
    const all = [
      { id: 'KYN-260928-0142', date: '28 Sep 2026, 14.20', s: 'bayar', name: 'Pashmina Airflow Sekar', more: '+2 produk lainnya', note: 'Bayar sebelum 29 Sep, 14.20', total: 'Rp238.000', tone: '#9DAE9B' },
      { id: 'KYN-260927-0137', date: '27 Sep 2026, 09.05', s: 'proses', name: 'Outer Linen Senja', more: '1 produk', note: '', total: 'Rp241.000', tone: '#D9A48C' },
      { id: 'KYN-260925-0131', date: '25 Sep 2026, 19.48', s: 'kirim', name: 'Segi Empat Voal Aruna', more: '1 produk', note: '', total: 'Rp101.000', tone: '#D9C7B0' },
      { id: 'KYN-260902-0044', date: '2 Sep 2026, 11.12', s: 'selesai', name: 'Bergo Instan Nara', more: '+1 produk lainnya', note: '', total: 'Rp148.000', tone: '#8E735E' }
    ];
    const tab = this.state.tab ?? 'semua';
    const list = all.filter((o) => tab === 'semua' || o.s === tab);
    const tabs = [['semua', 'Semua'], ['bayar', 'Menunggu Bayar'], ['proses', 'Diproses'], ['kirim', 'Dikirim'], ['selesai', 'Selesai'], ['batal', 'Dibatalkan']];
    return {
      tabs: tabs.map((t) => { const on = tab === t[0]; return { label: t[1], pressed: on ? 'true' : 'false', bg: on ? '#2B2B2B' : '#FFFFFF', fg: on ? '#FFF6F5' : '#2B2B2B', bd: on ? '#2B2B2B' : '#DCCBCD', pick: () => this.setState({ tab: t[0] }) }; }),
      orders: list.map((o) => Object.assign({}, o, { status: S[o.s].label, bg: S[o.s].bg, fg: S[o.s].fg, pay: o.s === 'bayar', done: o.s === 'selesai' })),
      empty: list.length === 0
    };
  }
}
</script>


</body></html>
