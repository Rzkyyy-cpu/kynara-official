<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<title>Buku Alamat — Mobile</title>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#FFF6F5;color:#2B2B2B;font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
a{color:#3F5A7D;text-decoration:none}
h1,h2,h3,h4,p{margin:0}
.serif{font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-weight:500;letter-spacing:-0.01em}
.muted{color:#5E5A62}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 20px;border-radius:999px;border:1px solid transparent;font:600 15px/1 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn-primary{background:#4A6588;color:#FFFFFF}
.link{height:44px;padding:0 4px;border:0;background:transparent;font:600 13px 'Plus Jakarta Sans',sans-serif;color:#3F5A7D;cursor:pointer}
.card{background:#FFFFFF;border:1px solid #EFE1E2;border-radius:16px}
.field{display:flex;flex-direction:column;gap:6px}
.label{font-size:13px;font-weight:600}
.input{width:100%;height:48px;padding:0 14px;border:1px solid #DCCBCD;border-radius:12px;background:#FFFFFF;color:#2B2B2B;font:400 15px 'Plus Jakarta Sans',sans-serif}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#5E5A62 50%),linear-gradient(135deg,#5E5A62 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat}
textarea.input{height:88px;padding:12px 14px;resize:none}
.chip{display:inline-flex;align-items:center;height:40px;padding:0 14px;border-radius:999px;border:1px solid #DCCBCD;background:#FFFFFF;font:500 14px 'Plus Jakarta Sans',sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 1560px; display: flex; flex-direction: column; background: #FFF6F5">
<div style="position: sticky; top: 0; z-index: 30"><dc-import name="NavMobile" hint-size="390px,64px"></dc-import></div>
<header style="padding: 12px 20px 0 8px; display: flex; align-items: center; gap: 4px">
<a href="MAkun.dc.html" aria-label="Kembali ke Akun" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #2B2B2B"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
<h1 class="serif" style="font-size: 28px; line-height: 36px">Buku alamat</h1>
</header>
<main style="padding: 20px; display: flex; flex-direction: column; gap: 14px">
<article class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 6px; border-color: #708BAA; box-shadow: inset 0 0 0 1px #708BAA">
<div style="display: flex; gap: 8px; align-items: center"><strong style="font-size: 14px">Rumah</strong><span style="height: 22px; padding: 0 8px; border-radius: 999px; background: #E4F0F4; color: #2B3E5B; font-size: 11px; font-weight: 700; display: flex; align-items: center">Utama</span></div>
<span style="font-size: 14px; font-weight: 600">Nadia Azzahra · 0812-3456-7890</span>
<p class="muted" style="font-size: 14px; line-height: 21px">Jl. Contoh No. 12, RT 03/RW 05, Kel. Contoh, Kec. Contoh, Kota Contoh, Jawa Barat 46xxx</p>
<div style="display: flex; gap: 12px"><button type="button" class="link">Ubah</button><button type="button" class="link" style="color: #8C2F48">Hapus</button></div>
</article>
<article class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 6px">
<strong style="font-size: 14px">Kos</strong>
<span style="font-size: 14px; font-weight: 600">Nadia Azzahra · 0812-3456-7890</span>
<p class="muted" style="font-size: 14px; line-height: 21px">Jl. Contoh Kampus No. 4, Kec. Contoh, Kota Contoh, Jawa Barat 46xxx</p>
<div style="display: flex; gap: 12px"><button type="button" class="link">Ubah</button><button type="button" class="link" style="color: #8C2F48">Hapus</button><button type="button" class="link">Jadikan utama</button></div>
</article>

<button type="button" sc-camel-on-click="{{toggle}}" aria-expanded="{{openStr}}" style="height: 52px; border: 1.5px dashed #C9B7BA; border-radius: 14px; background: transparent; display: flex; align-items: center; justify-content: center; gap: 8px; font: 600 15px 'Plus Jakarta Sans', sans-serif; color: #2B2B2B; cursor: pointer"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Tambah alamat baru</button>

<sc-if value="{{open}}" hint-placeholder-val="{{true}}">
<form class="card" style="padding: 20px 16px; display: flex; flex-direction: column; gap: 16px">
<h2 style="font-size: 17px; font-weight: 700">Alamat baru</h2>
<fieldset style="border: 0; padding: 0; margin: 0"><legend class="label" style="margin-bottom: 8px; padding: 0">Simpan sebagai</legend><div style="display: flex; gap: 8px; flex-wrap: wrap"><button type="button" class="chip" style="background: #2B2B2B; color: #FFF6F5; border-color: #2B2B2B">Rumah</button><button type="button" class="chip">Kantor</button><button type="button" class="chip">Kos</button><button type="button" class="chip">Lainnya</button></div></fieldset>
<div class="field"><label class="label" for="a1">Nama penerima</label><input id="a1" class="input" autocomplete="name"></div>
<div class="field"><label class="label" for="a2">Nomor HP</label><input id="a2" class="input" type="tel" inputmode="tel" placeholder="08xx xxxx xxxx"></div>
<div class="field"><label class="label" for="a3">Provinsi</label><sc-raw-select id="a3" class="input"><option>Pilih provinsi</option><option>Jawa Barat</option></sc-raw-select></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px"><div class="field"><label class="label" for="a4">Kota/Kab.</label><sc-raw-select id="a4" class="input"><option>Pilih</option></sc-raw-select></div><div class="field"><label class="label" for="a5">Kecamatan</label><sc-raw-select id="a5" class="input"><option>Pilih</option></sc-raw-select></div></div>
<div class="field"><label class="label" for="a6">Kode pos</label><input id="a6" class="input" inputmode="numeric" maxlength="5"></div>
<div class="field"><label class="label" for="a7">Alamat lengkap</label><textarea id="a7" class="input" placeholder="Nama jalan, nomor rumah, RT/RW"></textarea></div>
<div class="field"><label class="label" for="a8">Patokan untuk kurir <span class="muted" style="font-weight: 400">(opsional)</span></label><input id="a8" class="input" placeholder="Contoh: pagar hijau, dekat masjid"></div>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px; min-height: 44px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #3F5A7D; margin: 0">Jadikan alamat utama</label>
<button type="button" class="btn btn-primary" style="width: 100%">Simpan Alamat</button>
</form>
</sc-if>
</main>
<div style="position: sticky; bottom: 0; z-index: 30; margin-top: auto"><dc-import name="BottomNav" active="akun" hint-size="390px,64px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:1560}}">
class Component extends DCLogic {
  renderVals() {
    const open = this.state.open ?? true;
    return { open: open, openStr: open ? 'true' : 'false', toggle: () => this.setState({ open: !open }) };
  }
}
</script>


</body></html>
