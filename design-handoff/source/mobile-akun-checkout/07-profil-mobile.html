<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<title>Profil — Mobile</title>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#FFF6F5;color:#2B2B2B;font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
a{color:#3F5A7D;text-decoration:none}
h1,h2,h3,h4,p{margin:0}
.serif{font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-weight:500;letter-spacing:-0.01em}
.muted{color:#5E5A62}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 20px;border-radius:999px;border:1px solid transparent;font:600 15px/1 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn-primary{background:#4A6588;color:#FFFFFF}
.btn-outline{background:transparent;color:#2B2B2B;border-color:#DCCBCD}
.card{background:#FFFFFF;border:1px solid #EFE1E2;border-radius:16px}
.field{display:flex;flex-direction:column;gap:6px}
.label{font-size:13px;font-weight:600}
.input{width:100%;height:48px;padding:0 14px;border:1px solid #DCCBCD;border-radius:12px;background:#FFFFFF;color:#2B2B2B;font:400 15px 'Plus Jakarta Sans',sans-serif}
.row{display:flex;align-items:center;justify-content:space-between;min-height:56px;padding:0 16px;font-size:15px;font-weight:600;color:#2B2B2B;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 1000px; display: flex; flex-direction: column; background: #FFF6F5">
<div style="position: sticky; top: 0; z-index: 30"><dc-import name="NavMobile" hint-size="390px,64px"></dc-import></div>
<header style="padding: 12px 20px 0 8px; display: flex; align-items: center; gap: 4px">
<a href="MAkun.dc.html" aria-label="Kembali ke Akun" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #2B2B2B"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
<h1 class="serif" style="font-size: 28px; line-height: 36px">Profil</h1>
</header>
<main style="padding: 20px; display: flex; flex-direction: column; gap: 16px">
<sc-if value="{{saved}}" hint-placeholder-val="{{false}}">
<div role="status" style="padding: 12px 14px; border-radius: 12px; background: #E4F0F4; color: #2B3E5B; display: flex; gap: 10px; align-items: center; font-size: 14px; font-weight: 600"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>Perubahan profil tersimpan</div>
</sc-if>
<div style="display: flex; align-items: center; gap: 14px"><span style="width: 64px; height: 64px; border-radius: 999px; background: #3F5A7D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px">NA</span><button type="button" class="btn btn-outline" style="height: 44px; font-size: 14px">Ganti foto</button></div>
<div class="field"><label class="label" for="p1">Nama lengkap</label><input id="p1" class="input" value="Nadia Azzahra"></div>
<div class="field"><label class="label" for="p2">Email</label><input id="p2" class="input" type="email" value="nadia@email.com"><span style="font-size: 12px; color: #33496A; font-weight: 600; display: flex; gap: 6px; align-items: center"><svg width="14" height="14" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>Terverifikasi · terhubung dengan Google</span></div>
<div class="field"><label class="label" for="p3">Nomor WhatsApp</label><input id="p3" class="input" type="tel" value="0812-3456-7890"></div>
<div class="field"><label class="label" for="p4">Tanggal lahir <span class="muted" style="font-weight: 400">(opsional)</span></label><input id="p4" class="input" type="date"></div>
<button type="button" class="btn btn-primary" sc-camel-on-click="{{save}}" style="width: 100%">Simpan Perubahan</button>
<div class="card" style="margin-top: 8px">
<a class="row" href="MLupa.dc.html">Ubah password <svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>
<div style="height: 1px; background: #EFE1E2"></div>
<a class="row" href="MAlamat.dc.html">Buku alamat <svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>
<div style="height: 1px; background: #EFE1E2"></div>
<a class="row" href="MMasuk.dc.html" style="color: #8C2F48">Keluar</a>
</div>
</main>
<div style="position: sticky; bottom: 0; z-index: 30; margin-top: auto"><dc-import name="BottomNav" active="akun" hint-size="390px,64px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:1000}}">
class Component extends DCLogic {
  renderVals() {
    return { saved: this.state.saved ?? false, save: () => this.setState({ saved: true }) };
  }
}
</script>


</body></html>
