<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<title>Daftar — Desktop</title>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#FFF6F5;color:#2B2B2B;font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
a{color:#3F5A7D;text-decoration:none}
h1,h2,h3,h4,p{margin:0}
.serif{font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-weight:500;letter-spacing:-0.01em}
.muted{color:#5E5A62}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 20px;border-radius:999px;border:1px solid transparent;font:600 15px/1 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer;white-space:nowrap;text-decoration:none;width:100%}
.btn-primary{background:#4A6588;color:#FFFFFF}
.btn-outline{background:#FFFFFF;color:#2B2B2B;border-color:#DCCBCD}
.btn:disabled{background:#EFE1E2;color:#7A7074;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px}
.label{font-size:13px;font-weight:600}
.hint{font-size:12px;color:#5E5A62}
.input{width:100%;height:48px;padding:0 14px;border:1px solid #DCCBCD;border-radius:12px;background:#FFFFFF;color:#2B2B2B;font:400 15px 'Plus Jakarta Sans',sans-serif}
.input:focus{outline:2px solid #708BAA;outline-offset:1px}
.g{width:22px;height:22px;border-radius:999px;border:1.5px solid #2B2B2B;display:inline-flex;align-items:center;justify-content:center;font:700 12px 'Plus Jakarta Sans',sans-serif}
.or{display:flex;align-items:center;gap:12px;font-size:13px;color:#5E5A62}.or::before,.or::after{content:"";flex:1;height:1px;background:#EFE1E2}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: grid; grid-template-columns: 1fr 1fr; background: #FFF6F5">
<aside style="position: relative; overflow: hidden; margin: 24px 0 24px 24px; border-radius: 20px; background: #F4C9CB; display: flex; flex-direction: column; justify-content: space-between; padding: 40px">
<svg sc-camel-view-box="0 0 80 100" sc-camel-preserve-aspect-ratio="xMidYMax meet" style="position: absolute; left: 22%; bottom: 0; width: 56%; height: 82%" aria-hidden="true"><path d="M40 12c-11 0-19 9-19 21 0 5 1.5 9.5 3.5 13C15 52 8 64 6 100h68c-2-36-9-48-18.5-54 2-3.5 3.5-8 3.5-13 0-12-8-21-19-21z" fill="#FFFFFF" fill-opacity="0.3"></path></svg>
<a href="Main.dc.html" style="position: relative; font-family: 'Playfair Display', Georgia, serif; font-size: 32px; font-weight: 500; color: #2B2B2B">kynara</a>
<ul style="position: relative; margin: 0; padding: 20px 24px; list-style: none; display: flex; flex-direction: column; gap: 12px; border-radius: 16px; background: rgba(255,253,249,0.9); max-width: 380px; font-size: 15px">
<li style="display: flex; gap: 10px; align-items: center"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="#3F5A7D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>Checkout lebih cepat, alamat tersimpan</li>
<li style="display: flex; gap: 10px; align-items: center"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="#3F5A7D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>Pantau status dan resi pesanan</li>
<li style="display: flex; gap: 10px; align-items: center"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="#3F5A7D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>Simpan produk favorit di wishlist</li>
</ul>
</aside>
<main style="display: flex; align-items: center; justify-content: center; padding: 40px">
<div style="width: 440px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px"><h1 class="serif" style="font-size: 40px; line-height: 48px">Buat akun</h1><p class="muted" style="font-size: 15px; line-height: 24px">Daftar sekali, belanja berikutnya jadi lebih cepat.</p></div>
<button type="button" class="btn btn-outline"><span class="g" aria-hidden="true">G</span>Daftar dengan Google</button>
<div class="or">atau isi data</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div class="field"><label class="label" for="nm">Nama lengkap</label><input id="nm" class="input" autocomplete="name"></div>
<div class="field"><label class="label" for="wa">Nomor WhatsApp</label><input id="wa" class="input" type="tel" placeholder="08xx xxxx xxxx"></div>
</div>
<div class="field"><label class="label" for="em">Email</label><input id="em" class="input" type="email" autocomplete="email" placeholder="nama@email.com"></div>
<div class="field"><label class="label" for="pw">Password</label><input id="pw" class="input" type="password" autocomplete="new-password" placeholder="Minimal 8 karakter"><span class="hint">Gunakan minimal 8 karakter, campur huruf dan angka.</span></div>
<label style="display: flex; gap: 12px; align-items: flex-start; font-size: 14px; line-height: 21px; cursor: pointer"><input type="checkbox" checked="{{agree}}" sc-camel-on-change="{{toggle}}" style="width: 18px; height: 18px; margin: 2px 0 0; accent-color: #3F5A7D; flex-shrink: 0"><span>Saya setuju dengan <a href="DDaftar.dc.html" style="text-decoration: underline">Syarat &amp; Ketentuan</a> dan <a href="DDaftar.dc.html" style="text-decoration: underline">Kebijakan Privasi</a>.</span></label>
<button type="button" class="btn btn-primary" disabled="{{off}}">Buat Akun</button>
<p style="text-align: center; font-size: 14px">Sudah punya akun? <a href="DMasuk.dc.html" style="font-weight: 700">Masuk</a></p>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals() {
    const agree = this.state.agree ?? false;
    return { agree: agree, off: !agree, toggle: () => this.setState({ agree: !agree }) };
  }
}
</script>


</body></html>
